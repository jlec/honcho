---
name: honcho

services:
  api:
    ports:
      - 8000

  redis:
    image: redis:7.4-alpine

  caddy:
    image: caddy:2
    container_name: honcho-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - api
